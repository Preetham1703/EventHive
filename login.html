<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVENTHIVE</title>
    <link rel="stylesheet" href="library/bootstrap.min.css">
    <link rel="icon" href="images/logo.jpg">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url("images/login\ background.jpg"); 
            background-size: cover;
            background-repeat: no-repeat; 
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: rgb(237, 234, 234);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        .login-container h2 {
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .remember-me {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .remember-me a {
            text-decoration: none;
            color: blue;
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            border: none;
            background-color: blue;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        .register-link {
            margin-top: 10px;
            font-size: 14px;
        }

        .register-link a {
            text-decoration: none;
            color: blue;
        }

        footer {
            background: #343a40;
            color: white;
            text-align: center;
            padding: 15px;
            padding-bottom: 0px;
            width: 100%;
            margin-top: auto; 
        }
        #footer a{
            text-decoration: none;
            color:dimgray;
        }
        #footer a:hover{
            color: blue;
        }
        .return a{
            text-decoration: none;
            color: blue;
        }

        
        @media (max-width: 768px) { 
            .login-container {
                width: 90%;
                max-width: 320px;
            }
        }

        @media (max-width: 480px) { 
            .login-container {
                width: 100%;
                max-width: 300px;
                padding: 15px;
            }
            .login-container h1 {
                font-size: 20px;
            }
            .input-group input {
                padding: 8px;
            }
            .login-btn {
                padding: 8px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- <div class="container-fluid"> -->
        <div class="wrapper">
            <div class="login-container">
                <h1>Welcome!</h1>
                <form action="dashboard.html" method="GET">

                    <div class="input-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="What's your email?" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your secure key" required>
                    </div>
                    <div class="remember-me">
                        <a href="#">Forgot Password?</a>
                    </div>
                    <button type="button" class="login-btn" onclick="window.location.href='dashboard.html'">Login</button>

                </form>
                <p class="register-link">Don't have an account? <a href="signup.html">Register</a></p>
                <p class="return"><a href="index.html">Return</a></p>
            </div>
        </div>
        


    <footer id="footer">
        <p>Copyrights &copy; 2025 EventHive. All rights reserved.</p>
        <p>📧<a href="mailto:preethambk0111@gmail.com">preethambk0111@gmail.com</a></p>
        <p> 📞<a href="tel:+916281175531" >+916281175531</a></p>
    </footer>
<!-- </div> -->

</body>
</html>
