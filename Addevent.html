<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVENTHIVE</title>
    <link rel="icon" href="images/logo.jpg">
    <link rel="stylesheet" href="library/bootstrap.min.css">
    <script src="library/bootstrap.bundle.min.js"></script>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #e3f2fd;
            font-family: 'Poppins', sans-serif;
        }
        #title {
            margin-top:5px;
            display: flex;
            align-items: center;
            padding: 15px;
            flex-direction: column;
            justify-content: center; 
            text-align: center;
            background: linear-gradient(135deg, #4a90e2, #007aff);
            color: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            flex-wrap: wrap;
            background-image: url(images/backg.jpg);
        }

        #title-img {
            height: 60px;
            width: 60px;
            border-radius: 50%;
        }
        #mainbar{
            margin-top: 3px;
            width: 100%;
            border-radius: 10px;
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container-fluid mt-3">
        <div id="title" class="shadow">
            <img src="images/logo.jpg" alt="EventHive" id="title-img">
            <h1> EVENT HIVE</h1>
        </div>
        <nav class="navbar navbar-expand-sm bg-dark navbar-dark sticky-top mt-1" style="border-radius:10px ;">
            <div class="container-fluid">
              <a class="navbar-brand" href="#">EventHive</a>
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="collapsibleNavbar">
                <ul class="navbar-nav">
                  <li class="nav-item">
                    <a class="nav-link" href="dashboard.html">Home</a>
                  </li>
                </ul>
              </div>
            </div>
          </nav>
    <div id="mainbar">
        <h2 style="text-align: center;"> ADD YOUR EVENT</h2>
        <form action="#" method="POST" class="needs-validation bg-light p-5 rounded" enctype="multipart/form-data" novalidate id="eventForm">
            <div class="input-group mb-3">
                <span class="input-group-text">Name</span>
                <input type="text" class="form-control" name="name" placeholder="Enter Event Name" required>
            </div>
            <div class="form-floating mt-4">
                <select name="category" class="form-select" required>
                    <option value="Music">Music</option>
                    <option value="Drama">Drama</option>
                    <option value="Comedy">Comedy</option>
                    <option value="Dance">Dance</option>
                    <option value="Exhibitions">Exhibitions</option>
                    <option value="MagicShow">MagicShow</option>
                </select>
                <label for="category">Select your Category</label>
            </div>
            <div class="form-floating mt-4">
                <select name="city" class="form-select" required>
                    <option value="">Select a city</option>
                    <option value="Bangalore">Bangalore</option>
                    <option value="Hyderabad">Hyderabad</option>
                    <option value="Mumbai">Mumbai</option>
                    <option value="Vizag">Vizag</option>
                    <option value="Karimnagar">Karimnagar</option>
                </select>
                <label for="city">Select your City</label>
            </div>
            <br>
            <div class="input-group mb-3">
                <span class="input-group-text">Date</span>
                <input type="date" class="form-control" name="event_date" required>
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">Time</span>
                <input type="time" class="form-control" name="event_time" required>
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">PINCODE</span>
                <input type="text" class="form-control" name="pincode" placeholder="Enter Pincode" required>
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">Enter full Address</span>
                <textarea name="address" rows="3" class="form-control"></textarea>
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text">Proof of conduction</span>
                <input type="file" class="form-control" name="file" required>
            </div>
            <button class="btn btn-info" type="button">Add Event</button>
        </form>
        
        </div>



</body>
</html>
